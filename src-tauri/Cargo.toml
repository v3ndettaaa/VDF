[package]
name = "vdf-app"
description = "VDF Tauri v2 application shell: windows, dialogs, IPC, platform glue"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
default-run = "vdf-app"

[lib]
name = "vdf_app_lib"
crate-type = ["staticlib", "cdylib", "lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
vdf-core = { workspace = true }
vdf-document = { workspace = true }
vdf-diag = { workspace = true }
vdf-pdf = { workspace = true }
vdf-render = { workspace = true }
mupdf-sys = { workspace = true }
crossbeam-channel = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
vdf-persist = { workspace = true }
vdf-search = { workspace = true }
