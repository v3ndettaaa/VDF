name: build-windows

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain (GNU — links the MinGW-built MuPDF)
        run: |
          rustup toolchain install 1.98.1 --profile minimal --target x86_64-pc-windows-gnu
          rustup default 1.98.1-x86_64-pc-windows-gnu

      - name: Set up MSYS2 (MinGW gcc + make for MuPDF)
        uses: msys2/setup-msys2@v2
        with:
          update: false
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-binutils make

      - name: Put MinGW tools on PATH
        shell: pwsh
        run: |
          echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\msys64\usr\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Build bundles (MSI)
        run: npm run tauri build

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: vdf-windows-msi
          if-no-files-found: error
          path: target/release/bundle/msi/*.msi

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: vdf-windows-portable
          if-no-files-found: error
          path: target/release/vdf-app.exe
